<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Onetachka — Прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; font-family: 'Manrope', system-ui, sans-serif;
    background: #DEDDD6; height: 100%; overflow: hidden; }
  button { font-family: 'Manrope', system-ui, sans-serif; }
  #root { height: 100%; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* screen transition */
  @keyframes screenIn { from { transform: translateX(16px); } to { transform: translateX(0); } }
  .screen-anim { animation: screenIn .26s cubic-bezier(.22,.9,.3,1) both; }

  /* matching radar */
  .radar { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
  .radar-core { width: 56px; height: 56px; border-radius: 50%; background: #F2C84B; display: flex; align-items: center; justify-content: center; z-index: 2; box-shadow: 0 8px 24px rgba(242,200,75,.5); }
  .radar-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(242,200,75,.6); animation: ripple 2s ease-out infinite; }
  .radar-ring.r2 { animation-delay: 1s; }
  @keyframes ripple { 0% { transform: scale(.45); opacity: .9; } 100% { transform: scale(1.05); opacity: 0; } }

  /* pulse dot */
  .pulse-dot { width: 9px; height: 9px; border-radius: 50%; background: #F2C84B; box-shadow: 0 0 0 0 rgba(242,200,75,.7); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242,200,75,.6); } 70% { box-shadow: 0 0 0 8px rgba(242,200,75,0); } 100% { box-shadow: 0 0 0 0 rgba(242,200,75,0); } }

  /* app switcher */
  .switcher { display: inline-flex; background: rgba(255,255,255,.65); border: 1px solid rgba(0,0,0,.06); border-radius: 999px; padding: 4px; gap: 2px; backdrop-filter: blur(8px); }
  .switcher button { border: none; background: none; cursor: pointer; padding: 9px 20px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #6C6F78; transition: all .18s; display: flex; align-items: center; gap: 7px; }
  .switcher button.on { background: #1E3A8A; color: #fff; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="client-screens.jsx"></script>
<script type="text/babel" src="driver-screens.jsx"></script>
<script type="text/babel" src="extra-screens.jsx"></script>
<script type="text/babel" src="auth-settings.jsx"></script>

<script type="text/babel">
const { useState, useRef } = React;

const CLIENT = { home: CHome, create: CCreate, matching: CMatching, drivers: CDrivers, tracking: CTracking, chat: CChat, rating: CRating, orders: COrders, chats: CChats, profile: CProfile, settings: Settings, payments: Payments, addresses: Addresses, promos: Promos, verify: Verify, business: Business, login: Login, register: Register, otp: Otp, onboarding: Onboarding };
const DRIVER = { dhome: DHome, incoming: DIncoming, dnav: DNav, earnings: DEarnings, dorders: DOrders, dchats: DChats, dprofile: DProfile, chat: CChat, settings: Settings, documents: Documents, premium: Premium, login: Login, register: Register, otp: Otp, onboarding: Onboarding };

const ACCENTS = {
  '#F2C84B': '#E0B62F',
  '#1FA86A': '#178A56',
  '#2E6BFF': '#1E54D8',
  '#FF6A1A': '#E0530A',
};
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F2C84B",
  "radius": "round"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // sync tweak values into the live token object before rendering
  T.accent = t.accent;
  T.accentDark = ACCENTS[t.accent] || '#E0B62F';
  const R = t.radius === 'sharp' ? { radSheet: 16, radCard: 12, radBtn: 11 } : t.radius === 'pill' ? { radSheet: 36, radCard: 26, radBtn: 22 } : { radSheet: 30, radCard: 22, radBtn: 16 };
  Object.assign(T, R);

  const [role, setRole] = useState('client');
  const [screen, setScreen] = useState('home');
  const [app, setApp] = useState({ size: 'm', active: false, step: 0, online: false });
  const histRef = useRef([]);

  const set = (patch) => setApp(a => ({ ...a, ...patch }));
  const nav = {
    go: (s, params) => { histRef.current.push(screen); setScreen(s); if (params) set(params); },
    back: () => { const prev = histRef.current.pop(); if (prev) setScreen(prev); },
  };

  const switchRole = (r) => {
    setRole(r);
    histRef.current = [];
    setScreen(r === 'client' ? 'home' : 'dhome');
  };

  const map = role === 'client' ? CLIENT : DRIVER;
  const Screen = map[screen] || map[role === 'client' ? 'home' : 'dhome'];

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-start', paddingTop: 20, gap: 16 }}>
      {/* top: brand + switcher */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
        <Logo size={18}/>
        <div className="switcher">
          <button className={role==='client' ? 'on' : ''} onClick={() => switchRole('client')}><Icon name="user" size={17} color={role==='client'?'#fff':'#6C6F78'}/> Клієнт</button>
          <button className={role==='driver' ? 'on' : ''} onClick={() => switchRole('driver')}><Icon name="box" size={17} color={role==='driver'?'#fff':'#6C6F78'}/> Водій</button>
        </div>
      </div>

      {/* device */}
      <div style={{ transform: 'scale(var(--devscale, 0.82))', transformOrigin: 'top center' }}>
        <IOSDevice>
          <div style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
            <div key={role + screen} className="screen-anim" style={{ position: 'absolute', inset: 0 }}>
              <Screen nav={nav} app={app} set={set}/>
            </div>
          </div>
        </IOSDevice>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Бренд"/>
        <TweakColor label="Акцентний колір" value={t.accent}
          options={['#F2C84B', '#1FA86A', '#2E6BFF', '#FF6A1A']}
          onChange={(v) => setTweak('accent', v)}/>
        <TweakRadio label="Кути" value={t.radius}
          options={['sharp', 'round', 'pill']}
          onChange={(v) => setTweak('radius', v)}/>
      </TweaksPanel>
    </div>
  );
}

// fit device scale to viewport height
function fit() {
  const h = window.innerHeight;
  const s = Math.min(0.92, Math.max(0.6, (h - 130) / 874));
  document.documentElement.style.setProperty('--devscale', s.toFixed(3));
}
window.addEventListener('resize', fit); fit();

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
